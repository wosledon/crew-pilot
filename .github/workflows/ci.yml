name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore CrewPilot.slnx
      - name: Build
        run: dotnet build CrewPilot.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test CrewPilot.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend lint, format & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm run test:run
      - name: Verify generated OpenAPI types
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api-schema.d.ts
      - name: Build
        run: npm run build
